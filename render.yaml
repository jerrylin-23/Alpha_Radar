# Render deployment configuration
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: ict-analyzer
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir src --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DEMO_MODE
        value: "true"
    healthCheckPath: /
    autoDeploy: true
